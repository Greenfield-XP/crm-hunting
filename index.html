<script>/* CRM Hunting · versão site. A base é a planilha Google "CRM Hunting · Base", acessada pelo intermediário (Cloudflare Worker) com login próprio. */
(function(){
"use strict";
const CFG=window.CRM_SITE||{};
const SHEET=CFG.sheetId, WORKER=(CFG.workerUrl||"").replace(/\/+$/,"");
const API=WORKER+"/s";
const TABS={prospects:"Pessoas",deals:"Deals",interacoes:"Interações",todos:"To-dos",templates:"Templates",roadmap:"Roadmap",config:"Config"};
const NUM=new Set(["aucMi","ccMi","multaMil","hcIni","diferidoMil","roaPct","anosCasa","anosMercado","equipeQtd","nonCompeteMeses","filiais","matrizes","unidadesBtg","ordem","abordagensSemana","conversaoCallMax","conversaoCallMin"]);
const DATE=new Set(["data","dataProximo","dataAbordagem","prazo","criadoEm","concluidoEm","dataEtapa","atualizadoEm"]);
window.__SITE=true;
const mem={};             // col -> Map(id -> doc)
const meta={};            // col -> {header:[...]}
const listeners={};       // col -> Set(cb)
let token=null, tokenExp=0, user="", authWaiters=[], busy=0, lastSig={};
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));

// ---------- UI de login/estado
function ui(){
  const st=document.createElement("style");st.textContent=`
.ss-ov{position:fixed;inset:0;z-index:10000;background:var(--bg,#F4F4F1);display:flex;align-items:center;justify-content:center;padding:24px;font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;color:var(--ink,#16191D)}
.ss-card{max-width:420px;width:100%;background:var(--surface,#fff);border:1px solid var(--line,#E3E3DE);border-radius:16px;padding:28px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.ss-card h1{font-size:22px;margin:0 0 6px}.ss-card p{margin:0 0 18px;color:var(--muted,#6A6F76);font-size:14px}
.ss-btn{width:100%;justify-content:center;display:inline-flex;align-items:center;gap:10px;border:0;background:#0E6656;color:#fff;border-radius:10px;padding:11px 18px;font:600 15px system-ui,sans-serif;cursor:pointer;margin-top:4px}.ss-btn:disabled{opacity:.6}
.ss-in{display:block;width:100%;box-sizing:border-box;margin:0 0 10px;padding:11px 12px;border:1px solid var(--line,#E3E3DE);border-radius:10px;font:15px system-ui,sans-serif;background:#fff;color:#16191D}
.ss-err{color:#B23A3A;font-size:13px;margin-top:14px}
.ss-bar{position:fixed;right:12px;bottom:12px;z-index:9998;display:flex;gap:8px;align-items:center;background:#16191D;color:#fff;border-radius:999px;padding:7px 12px;font:12px system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.ss-bar button{background:none;border:0;color:#9fd6c8;font:inherit;cursor:pointer;padding:0}
.ss-dot{width:8px;height:8px;border-radius:50%;background:#6CC892}.ss-dot.busy{background:#F2B33D}.ss-dot.err{background:#E77D7D}`;
  document.head.appendChild(st);
}
let ov=null;
function showLogin(msg){
  if(!ov){ov=document.createElement("div");ov.className="ss-ov";document.body.appendChild(ov)}
  ov.innerHTML=`<form class="ss-card" id="ssForm" autocomplete="on"><h1>CRM Hunting</h1><p>Entre com o seu usuário e senha.</p>
   <input class="ss-in" id="ssUser" name="username" autocomplete="username" placeholder="Usuário" autocapitalize="none" required>
   <input class="ss-in" id="ssPass" name="password" type="password" autocomplete="current-password" placeholder="Senha" required>
   <button class="ss-btn" type="submit" id="ssGo">Entrar</button>${msg?`<div class="ss-err">${msg}</div>`:""}</form>`;
  const f=ov.querySelector("#ssForm");setTimeout(()=>{const u=ov&&ov.querySelector("#ssUser");if(u)u.focus()},50);
  f.onsubmit=async e=>{e.preventDefault();const b=ov.querySelector("#ssGo");b.disabled=true;b.textContent="Entrando…";
    try{const r=await fetch(WORKER+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:ov.querySelector("#ssUser").value,pass:ov.querySelector("#ssPass").value})});
      const j=await r.json().catch(()=>({}));if(!r.ok||!j.token){showLogin(j.error||"Não foi possível entrar.");return}
      onToken(j)}catch(err){showLogin("Não consegui falar com o servidor do CRM. Verifique a conexão.")}};
}
function hideLogin(){if(ov){ov.remove();ov=null}}
let bar=null;
function status(kind,txt){if(!bar){bar=document.createElement("div");bar.className="ss-bar";document.body.appendChild(bar)}
  bar.innerHTML=`<span class="ss-dot ${kind||""}"></span><span>${txt}</span><button id="ssRef">Atualizar</button><button id="ssOut">Sair</button>`;
  bar.querySelector("#ssRef").onclick=()=>refresh(true);
  bar.querySelector("#ssOut").onclick=()=>{token=null;try{localStorage.removeItem("ss_sess")}catch(_){};location.reload()};}

// ---------- autenticação (Google Identity Services)
function auth(){
  if(token&&Date.now()<tokenExp-60000)return Promise.resolve(token);
  return new Promise(res=>{authWaiters.push(res);showLogin(tokenExp?"Sua sessão expirou. Entre de novo para continuar.":"")});
}
function onToken(r){
  token=r.token;tokenExp=Date.now()+(r.dias||7)*864e5-3600e3;user=r.user||"";window.__siteUser=user;try{localStorage.setItem("ss_sess",JSON.stringify([token,tokenExp,user]))}catch(_){}
  hideLogin();const w=authWaiters;authWaiters=[];w.forEach(f=>f(token))}

// ---------- chamadas à API
async function api(path,opt){
  for(let tent=0;tent<2;tent++){
    const t=await auth();
    const r=await fetch(API+path,{...(opt||{}),headers:{"Authorization":"Bearer "+t,"Content-Type":"application/json",...((opt&&opt.headers)||{})}});
    if(r.status===401){token=null;tokenExp=1;try{localStorage.removeItem("ss_sess")}catch(_){};cacheClear();continue}
    if(r.status===403){const j=await r.json().catch(()=>({}));throw new Error("A planilha não está compartilhada com a conta de serviço do site."+(j.error&&j.error.message?" ("+j.error.message+")":""))}
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error((j.error&&j.error.message)||("Erro "+r.status))}
    return r.json();
  }
  throw new Error("Sessão expirada");
}
const A1=(tab,rng)=>`'${tab.replace(/'/g,"''")}'!${rng}`;
const colL=n=>{let s="";n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
function parseVal(k,s){
  if(s===""||s==null)return undefined;
  if(/^[\[{]/.test(s)){try{return JSON.parse(s)}catch(_){return s}}
  if(NUM.has(k)){let x=String(s).replace(/[R$\s%]/g,"");if(x.includes(","))x=x.replace(/\./g,"").replace(",",".");const n=+x;return isNaN(n)?s:n}
  if(k==="feito")return /^(true|verdadeiro|sim|1)$/i.test(s);
  if(DATE.has(k)){const m=String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(m)return `${m[3].length===2?"20"+m[3]:m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`}
  return String(s)}
function cellOut(v){if(v===undefined||v===null)return "";if(typeof v==="number"||typeof v==="boolean")return v;if(typeof v==="object")return JSON.stringify(v);const s=String(v);
  return (/^[=+@-]/.test(s)||(/^[\d\s.,:\/()-]+$/.test(s)&&/\d/.test(s))||/^(true|false)$/i.test(s))?"'"+s:s}
function rowsToDocs(col,vals){
  const header=(vals[0]||[]).map(x=>String(x||"").trim());meta[col]={header};
  const m=new Map(),rowOf=new Map();meta[col].rowOf=rowOf;if(header[0]!=="id")return m;
  for(let ri=1;ri<vals.length;ri++){const row=vals[ri];const id=String(row[0]||"").trim();if(!id)continue;rowOf.set(id,ri+1);if(String(row[header.indexOf("_sync")]||"")==="DEL")continue;
    const d={};header.forEach((k,i)=>{if(i===0||!k||k==="_sync")return;const v=parseVal(k,row[i]===undefined?"":String(row[i]));if(v!==undefined)d[k]=v});m.set(id,d)}
  return m}
function eventsFromRows(vals){
  // aba Eventos: uma linha por campo alterado -> agrupa por (data/hora, id, ação, origem)
  const out=new Map();
  (vals||[]).slice(1).forEach((r,i)=>{const [w,tipo,id,nome,acao,campo,de,para,origem,autor]=r.map(x=>x==null?"":String(x));if(!w&&!id)return;
    const key=[w,id,acao,origem].join("|");let e=out.get(key);
    if(!e){const m=w.match(/^(\d{2})\/(\d{2})\/(\d{4}),?\s*(\d{2}):(\d{2})/);const iso=m?`${m[3]}-${m[2]}-${m[1]}T${m[4]}:${m[5]}:00`:"";
      e={ts:iso,data:iso.slice(0,10),col:tipo==="Deal"?"deals":"prospects",docId:id,nome,acao,campos:[],origem,autorNome:autor};out.set(key,e)}
    if(campo){e.campos.push({campo,de,para});if(campo==="etapa"&&acao==="editado"){e.etapaDe=de;e.etapaPara=para}}});
  const m=new Map();let n=0;out.forEach(e=>m.set("ev"+(n++),e));return m}

let lastRev=null,lastSobre=["",""],evAt=0,evBusy=false;
const SOBRE_RNG=A1("Sobre","B12:B13");
const revOf=vals=>{const v=(vals||[]).map(r=>String((r&&r[0])||""));return [v[0]||"",v[1]||""]};
function applyTab(col,vals,force){const sig=vals.length+"|"+JSON.stringify(vals);if(sig!==lastSig[col]||force){lastSig[col]=sig;mem[col]=rowsToDocs(col,vals);emit(col);return true}return false}
function connStatus(){const vazio=!meta.prospects||meta.prospects.header[0]!=="id";
  status(vazio?"err":"",vazio?"A planilha ainda não foi preenchida pelo CRM":(user?user+" · ":"")+"Conectado à planilha · "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}))}
// cache local (IndexedDB): abre o site na hora com a última cópia e atualiza em segundo plano
const IDB="crm-site-cache";
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open(IDB,1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function cacheGet(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction("kv").objectStore("kv").get("snap");q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(_){return null}}
async function cachePut(v){try{const d=await idb();d.transaction("kv","readwrite").objectStore("kv").put(v,"snap")}catch(_){}}
async function cacheClear(){try{const d=await idb();d.transaction("kv","readwrite").objectStore("kv").delete("snap")}catch(_){}}
let cacheVals={};
async function refresh(manual){
  if(busy&&!manual)return;
  try{
    status("busy","Atualizando…");
    const cols=Object.keys(TABS),names=cols.map(c=>TABS[c]);
    const q=names.map(t=>"ranges="+encodeURIComponent(A1(t,"A1:DZ"))).join("&")+"&ranges="+encodeURIComponent(SOBRE_RNG);
    const j=await api("/values:batchGet?"+q+"&valueRenderOption=FORMATTED_VALUE");
    const vr=j.valueRanges||[];
    cols.forEach((col,i)=>{const vals=(vr[i]&&vr[i].values)||[];cacheVals[col]=vals;applyTab(col,vals,manual)});
    lastSobre=revOf(vr[cols.length]&&vr[cols.length].values);lastRev=lastSobre.join("|");
    connStatus();
    {const v={};Object.keys(TABS).forEach(c=>v[c]=cacheVals[c]);cachePut({u:user,ts:Date.now(),rev:lastRev,vals:v,ev:cacheVals.__ev||null})}
    if(Date.now()-evAt>5*60e3)setTimeout(()=>loadEvents(false),1500);
  }catch(e){status("err",e.message||"Erro ao ler a planilha");if(manual)alertMsg(e.message)}
}
// checagem leve: só baixa tudo de novo se a planilha mudou (revisão gravada pelo CRM e pelo site)
async function poll(){
  if(busy||document.visibilityState!=="visible")return;
  try{const j=await api("/values/"+encodeURIComponent(SOBRE_RNG)+"?valueRenderOption=FORMATTED_VALUE");const r=revOf(j.values).join("|");
    if(r!==lastRev)await refresh(false);else connStatus()}catch(e){status("err",e.message||"Erro ao ler a planilha")}
}
// log de eventos: carregado à parte, no máximo a cada 5 minutos
async function loadEvents(force){
  if(evBusy||(!force&&Date.now()-evAt<5*60e3))return;evBusy=true;evAt=Date.now();
  try{const j=await api("/values/"+encodeURIComponent(A1("Eventos","A1:J"))+"?valueRenderOption=FORMATTED_VALUE");const ev=j.values||[];
    const es=ev.length+(ev.length?JSON.stringify(ev[ev.length-1]):"");if(es!==lastSig.eventos){lastSig.eventos=es;mem.eventos=eventsFromRows(ev);emit("eventos")}
    cacheVals.__ev=ev}catch(_){}finally{evBusy=false}
}
// depois de gravar: marca nova revisão (para os outros usuários) sem baixar a planilha inteira de novo
async function bump(){const rev=new Date().toISOString()+" · "+(user||"site");
  try{await api("/values/"+encodeURIComponent(A1("Sobre","A13:B13"))+"?valueInputOption=RAW",{method:"PUT",body:JSON.stringify({values:[["Revisão",rev]]})});lastSobre=[lastSobre[0],rev];lastRev=lastSobre.join("|")}catch(_){}}
function alertMsg(m){try{window.toast?window.toast(m):console.warn(m)}catch(_){}}
function snap(col){const docs=[];(mem[col]||new Map()).forEach((d,id)=>docs.push({id,data:()=>clone(d),exists:true}));return {docs,metadata:{fromCache:false},size:docs.length}}
function emit(col){const ls=listeners[col];if(!ls)return;const s=snap(col);ls.forEach(cb=>{try{cb(s)}catch(e){console.error(e)}})}

// ---------- escrita
async function findRow(col,id){
  const tab=TABS[col];const r0=meta[col]&&meta[col].rowOf&&meta[col].rowOf.get(id);
  if(r0){try{const c=await api("/values/"+encodeURIComponent(A1(tab,"A"+r0))+"?valueRenderOption=FORMATTED_VALUE");if(String(((c.values||[])[0]||[])[0]||"").trim()===id)return r0}catch(_){}}
const j=await api("/values/"+encodeURIComponent(A1(tab,"A1:A"))+"?valueRenderOption=FORMATTED_VALUE");
  const ids=(j.values||[]).map(r=>String(r[0]||"").trim());const i=ids.indexOf(id);if(meta[col]&&meta[col].rowOf){meta[col].rowOf.clear();ids.forEach((x,k)=>{if(x)meta[col].rowOf.set(x,k+1)})}return i>=0?i+1:-1}
async function ensureCols(col,keys){
  const tab=TABS[col];let h=(meta[col]&&meta[col].header)||[];
  if(h[0]!=="id")throw new Error("A planilha ainda não foi preenchida pelo CRM. Abra o CRM no Claude uma vez.");
  const novos=keys.filter(k=>k&&k!=="id"&&k!=="_sync"&&!h.includes(k));
  if(novos.length){const start=h.length;await api("/values/"+encodeURIComponent(A1(tab,colL(start)+"1:"+colL(start+novos.length-1)+"1"))+"?valueInputOption=RAW",{method:"PUT",body:JSON.stringify({values:[novos]})});h=h.concat(novos);meta[col].header=h}
  return h}
async function writeFields(col,id,fields,full){
  const tab=TABS[col];busy++;
  try{
    const h=await ensureCols(col,Object.keys(fields));
    let row=await findRow(col,id);
    const data=[];
    if(row<0){ // linha nova
      const arr=h.map(k=>k==="id"?cellOut(id):k==="_sync"?"":cellOut(fields[k]));
      await api("/values/"+encodeURIComponent(A1(tab,"A1"))+":append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS",{method:"POST",body:JSON.stringify({values:[arr]})});
      return}
    h.forEach((k,i)=>{if(i===0||k==="_sync")return;if(k in fields)data.push({range:A1(tab,colL(i)+row),values:[[cellOut(fields[k])]]});else if(full)data.push({range:A1(tab,colL(i)+row),values:[[""]]})});
    if(full){const si=h.indexOf("_sync");if(si>0)data.push({range:A1(tab,colL(si)+row),values:[[""]]})}
    if(data.length)await api("/values:batchUpdate",{method:"POST",body:JSON.stringify({valueInputOption:"USER_ENTERED",data})});
  }finally{busy--}
}
async function markDelete(col,id){const tab=TABS[col];const h=(meta[col]&&meta[col].header)||[];const si=h.indexOf("_sync");const row=await findRow(col,id);
  if(row<0||si<0)return;await api("/values/"+encodeURIComponent(A1(tab,colL(si)+row))+"?valueInputOption=RAW",{method:"PUT",body:JSON.stringify({values:[["DEL"]]})})}
const rid=()=>"web-"+[...crypto.getRandomValues(new Uint8Array(6))].map(b=>b.toString(16).padStart(2,"0")).join("");
function local(col){return mem[col]=mem[col]||new Map()}
async function safe(fn){try{await fn();await bump();connStatus()}catch(e){status("err",e.message);alertMsg("Não salvou na planilha: "+e.message);setTimeout(()=>refresh(true),1500);throw e}}


// ---------- arquivos (aba "Arquivos" da planilha, em partes de texto)
const FT="Arquivos",FCH=45000;
function b64enc(ab){const u=new Uint8Array(ab);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
window.__siteFiles={
  async put(file,meta){
    const ab=await file.arrayBuffer();if(ab.byteLength>8e6)throw new Error("Arquivo acima de 8 MB");
    const b=b64enc(ab),id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),n=Math.max(1,Math.ceil(b.length/FCH)),now=new Date().toISOString();
    const rows=[];for(let i=0;i<n;i++){const h=i===0;rows.push([id,h?file.name:"",h?(file.type||""):"",h?ab.byteLength:"",h?(meta.dealId||""):"",h?(meta.tipoDoc||""):"",h?now:"",h?user:"",h?(meta.status||"pendente"):"",i,b.slice(i*FCH,(i+1)*FCH)])}
    busy++;try{for(let i=0;i<rows.length;i+=15)await api("/values/"+encodeURIComponent(A1(FT,"A1"))+":append?valueInputOption=RAW&insertDataOption=INSERT_ROWS",{method:"POST",body:JSON.stringify({values:rows.slice(i,i+15)})})}finally{busy--}
    return id},
  async get(id){
    const j=await api("/values/"+encodeURIComponent(A1(FT,"A1:J"))+"?valueRenderOption=FORMATTED_VALUE");const v=j.values||[];
    const idx=[];v.forEach((r,i)=>{if(r[0]===id)idx.push(i+1)});if(!idx.length)throw new Error("Arquivo não encontrado");
    const r0=Math.min(...idx),r1=Math.max(...idx);const k=await api("/values/"+encodeURIComponent(A1(FT,`A${r0}:K${r1}`)));
    const rows=(k.values||[]).filter(r=>r[0]===id).sort((a,b)=>(+a[9]||0)-(+b[9]||0));const head=rows[0]||[];
    const bin=atob(rows.map(r=>String(r[10]||"").replace(/^'/,"")).join(""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    return {nome:head[1],blob:new Blob([u],{type:head[2]||"application/octet-stream"})}},
  async list(status){
    const j=await api("/values/"+encodeURIComponent(A1(FT,"A1:J"))+"?valueRenderOption=FORMATTED_VALUE");const v=j.values||[];
    return v.map((r,i)=>({r,row:i+1})).filter(x=>x.row>1&&x.r[0]&&String(x.r[8]||"")===status&&(+(x.r[9]||0))===0)
      .map(x=>({id:x.r[0],nome:x.r[1],mime:x.r[2],tam:+x.r[3]||0,pasta:x.r[5]||"",data:x.r[6]||"",autor:x.r[7]||""}))},
  async del(id){
    const j=await api("/values/"+encodeURIComponent(A1(FT,"A1:A")));const v=j.values||[];
    const ranges=[];v.forEach((r,i)=>{if(r[0]===id)ranges.push(A1(FT,`A${i+1}:K${i+1}`))});if(!ranges.length)return;
    busy++;try{for(let i=0;i<ranges.length;i+=100)await api("/values:batchClear",{method:"POST",body:JSON.stringify({ranges:ranges.slice(i,i+100)})})}finally{busy--}}
};
const ready=(async()=>{
  ui();
  await new Promise(r=>document.readyState==="loading"?document.addEventListener("DOMContentLoaded",r):r());
  if(!WORKER||/COLE_AQUI/.test(WORKER)){showLogin("Site ainda não configurado: falta o endereço do servidor.");return new Promise(()=>{})}
  try{const s=JSON.parse(localStorage.getItem("ss_sess")||"null");if(s&&Date.now()<s[1]){token=s[0];tokenExp=s[1];user=s[2]||"";window.__siteUser=user}}catch(_){}
  const c=(token&&Date.now()<tokenExp)?await cacheGet():null;
  if(c&&c.u===user&&c.vals&&c.vals.prospects){
    Object.keys(TABS).forEach(col=>{const v=c.vals[col]||[];cacheVals[col]=v;applyTab(col,v,true)});
    if(c.ev){cacheVals.__ev=c.ev;mem.eventos=eventsFromRows(c.ev);lastSig.eventos=c.ev.length+(c.ev.length?JSON.stringify(c.ev[c.ev.length-1]):"")}
    status("busy","Cópia local carregada · atualizando…");
    setTimeout(()=>refresh(false),300);
  }else{await auth();await refresh(true)}
  setInterval(poll,30000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")poll()});
})();

const db={
  collection(col){return{
    onSnapshot(cb){(listeners[col]=listeners[col]||new Set()).add(cb);ready.then(()=>cb(snap(col)));return()=>listeners[col].delete(cb)},
    async get(){await ready;return snap(col)},
    async add(x){await ready;if(col==="eventos")return {id:"local"};if(!TABS[col])throw new Error("indisponível no site");const id=rid();local(col).set(id,clone(x));emit(col);await safe(()=>writeFields(col,id,x,false));return {id}}
  }},
  doc(p){const [col,id]=p.split("/");return{
    async get(){await ready;const d=(mem[col]||new Map()).get(id);return {id,exists:d!==undefined,data:()=>clone(d)}},

    async update(x){await ready;if(!TABS[col])throw new Error("indisponível no site");const cur=local(col).get(id)||{};const n={...cur};const out={};
      for(const k in x){const v=x[k];if(v&&typeof v==="object"&&v.__delete__){delete n[k];out[k]=""}else{n[k]=v;out[k]=v}}
      local(col).set(id,n);emit(col);await safe(()=>writeFields(col,id,out,false))},
    async delete(){await ready;if(!TABS[col])throw new Error("indisponível no site");local(col).delete(id);emit(col);await safe(()=>markDelete(col,id))}
  }}
};
function saveFile(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}

})();

/* funil */
.funnel{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:110px 1fr 120px;gap:10px;align-items:center;font-size:14px}
.fbar{height:22px;background:var(--sunk);border-radius:6px;overflow:hidden;position:relative}
.fbar i{display:block;height:100%;background:var(--accent);border-radius:6px;min-width:2px}
.fbar b{position:absolute;left:8px;top:2px;font-size:12px;font-family:var(--f-mono);font-weight:500;color:var(--fg)}
.frow .r{text-align:right;font-size:13px}
@media (max-width:520px){.frow{grid-template-columns:86px 1fr;}.frow .r{grid-column:2;text-align:left;margin-top:-4px}}
/* listas */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:0}
.li .t{font-weight:500}
.li .d{font-size:13px;color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500;text-align:left}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
/* pipeline */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.col{flex:0 0 240px;background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{font-size:14px;display:flex;justify-content:space-between;padding:2px 4px}
.colh{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-radius:8px;padding:4px 6px;font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--fg);cursor:pointer;text-align:left}
.colh:hover{background:var(--surface)}
.col.sel{outline:2px solid var(--accent);outline-offset:-2px}
.col.sel .colh{background:var(--accent);color:var(--accent-ink)}
.col.sel .colh .muted{color:var(--accent-ink)}
.cards{display:flex;flex-direction:column;gap:8px;max-height:452px;overflow-y:auto;padding-right:2px;overscroll-behavior:contain}
.selcell{width:36px;text-align:center}
.selcell input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
tr.picked td{background:var(--accent-soft)}
.bulk{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:3;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.bulk .bk{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.bulk .bk select,.bulk .bk input{width:auto;min-width:160px}
#dealsList,#leadsList{scroll-margin-top:calc(72px + env(safe-area-inset-top,0px))}
#ccList{scroll-margin-top:80px}
tr.ccrow{cursor:pointer}
tr.ccrow.on td{background:var(--accent-soft);font-weight:600}
tr.sub td{background:var(--sunk);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;width:100%}
.card:hover{border-color:var(--accent)}
.card .n{font-weight:600}
.card .m{font-size:12px;color:var(--muted)}
.chip.tpj{background:var(--cold-soft);color:var(--cold)}
.chip.tbt{background:var(--warm-soft);color:var(--warm)}
.card.deal{background:var(--accent-soft);border-color:var(--accent)}
.card.deal .eyebrow{color:var(--accent)}
/* filtros e tabela */
.mslab{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.ms{position:relative;min-width:0}
.ms-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;color:var(--fg);text-align:left;cursor:pointer;min-width:0}
.ms-btn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-btn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ms-car{color:var(--muted);font-size:11px}
.ms-pop{display:none;position:absolute;z-index:80;top:calc(100% + 4px);left:0;min-width:100%;width:max-content;max-width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.2);padding:8px}
.ms.open .ms-pop{display:block}
.ms-list{max-height:min(280px,50vh);overflow:auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.ms label.ms-it,.filters .ms label.ms-it{display:flex;flex-direction:row;align-items:center;gap:8px;padding:7px 4px;font-size:14px;color:var(--fg);cursor:pointer;border-radius:6px}
.ms-it:hover{background:var(--sunk)}
.ms-it input{width:18px;height:18px;margin:0;flex:none}
.ms-q{margin-bottom:6px}
.ms-ft{display:flex;justify-content:space-between;gap:8px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.fclear{display:flex;align-items:flex-end}
.segs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;width:max-content;max-width:100%;overflow-x:auto}
.segs .seg{border:0;background:transparent;font:inherit;font-size:14px;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--muted);white-space:nowrap}
.segs .seg.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kpis.six{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0;flex:none}
.mpleg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.mpleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:16px}
.icard{display:flex;flex-direction:column;gap:12px}
.icard-h{display:flex;align-items:center;gap:14px}
.icard-t{flex:1;min-width:0}.icard-t h3{margin:0;font-size:19px}.icard-t h3 .link{font:inherit;color:inherit;font-weight:700;text-align:left}
.ilogo{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;letter-spacing:.3px;overflow:hidden;flex:none}
.ilogo.big{width:64px;height:64px;font-size:17px;border-radius:14px}
.ilogo img{width:100%;height:100%;object-fit:contain;background:#fff}
.ilogo-up{flex:none}
.ibar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.ibar i{display:block;min-width:3px}
.istats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 12px}
.istats>div{display:flex;flex-direction:column}.istats b{font-size:20px;line-height:1.1}.istats span{font-size:12px;color:var(--muted);display:flex;align-items:center}
.istats.sm b{font-size:16px}
.ireg{width:100%;border-collapse:collapse;font-size:13px}
.ireg th{font-size:11px;color:var(--muted);font-weight:500;text-align:left;padding:4px 4px;border-bottom:1px solid var(--line)}
.ireg td{padding:6px 4px;border-bottom:1px solid var(--sunk);vertical-align:middle}
.ireg th.r,.ireg td.r{text-align:right}.ireg th .dot{margin:0}
.ireg-b{height:4px;background:var(--sunk);border-radius:99px;margin-top:4px;max-width:160px}.ireg-b i{display:block;height:100%;background:var(--accent);border-radius:99px}
.mpwrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,1fr);gap:20px;align-items:start}
@media (max-width:820px){.mpwrap{grid-template-columns:1fr}}
.mpmap{display:flex;flex-direction:column;gap:8px}
.brmap{width:100%;height:auto;max-height:560px}
.brmap path{stroke:var(--surface);stroke-width:1;cursor:pointer;transition:opacity .15s}
.brmap path:hover{opacity:.8}.brmap path.sel{stroke:var(--fg);stroke-width:2}
.brmap .ml{font-size:11px;font-weight:700;fill:var(--fg);text-anchor:middle;dominant-baseline:middle;pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.brmap.tile g{cursor:pointer}.brmap.tile rect{stroke:var(--surface);stroke-width:2}.brmap.tile g.sel rect{stroke:var(--fg)}
.brmap.tile g.dk text{fill:#fff}.brmap.tile .t1{font-size:13px;font-weight:700;text-anchor:middle;fill:var(--fg)}.brmap.tile .t2{font-size:12px;text-anchor:middle;fill:var(--fg)}
.mpscale{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}.mpscale i{flex:1;max-width:220px;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--sunk),color-mix(in srgb,var(--accent) 30%,var(--surface)),var(--accent))}
.mpside{display:flex;flex-direction:column;gap:8px}.mpside h3{margin:0}
.mprank{display:flex;flex-direction:column;gap:4px}
.mprank button{position:relative;display:flex;justify-content:space-between;align-items:center;border:0;background:var(--sunk);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer;overflow:hidden;color:var(--fg);text-align:left}
.mprank button i{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft)}.mprank button span,.mprank button b{position:relative}
.mpcities{display:flex;flex-direction:column;font-size:13px}.mpcities>div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--sunk)}
.bmx{display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;gap:4px 8px}
.bmx-y{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;color:var(--muted);text-align:center}
.bmx-x{grid-column:2;font-size:11px;color:var(--muted);text-align:right}
.bmx-t{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.bmx-t th,.bmx-t td{background:none!important;border:0!important;padding:2px!important;font-family:inherit!important;text-transform:none!important;letter-spacing:0!important;position:static!important}
.bmx-t th{font-size:11px;color:var(--muted);font-weight:500;text-align:center}
.bmx-t tbody th{text-align:right!important;width:96px;line-height:1.25;white-space:normal}.bmx-t thead th:first-child{width:96px}
.bmx-c{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;min-height:74px;padding:6px;border-radius:8px;border:1px solid var(--line);background:color-mix(in srgb,var(--cold) calc(var(--a)*28%),var(--surface));font:inherit;color:var(--fg);cursor:pointer;text-align:left}
div.bmx-c{cursor:default}
.bmx-c.hot{background:color-mix(in srgb,var(--accent) calc(12% + var(--a)*40%),var(--surface));border-color:var(--accent)}
.bmx-c.on{outline:2px solid var(--fg);outline-offset:1px}
.bmx-c b{font-size:18px;line-height:1}
.bmx-tag{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.4px}
.bmx-dots{display:flex;flex-wrap:wrap;gap:2px}.bmx-dots i{width:7px;height:7px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.08)}.bmx-dots em{font-size:10px;color:var(--muted);font-style:normal}
.bboard{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.bcol{background:var(--sunk);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.bcol-h{display:flex;justify-content:space-between;padding:4px 6px}
.bcol-b{display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.bcard{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;color:var(--fg);cursor:pointer}
.bcard:hover{border-color:var(--accent)}
.bcard-h{display:flex;justify-content:space-between;gap:8px}
.bchips{display:flex;flex-wrap:wrap;gap:4px}.bchips .chip{display:inline-flex;align-items:center;border:1px solid transparent}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--sunk);position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--accent-soft)}
td.r,th.r{text-align:right}
tfoot td{background:var(--sunk);font-weight:500;border-top:2px solid var(--line)}
.dtable td:first-child,.dtable th:first-child{position:sticky;left:0;z-index:1}
.dtable td:first-child{background:var(--surface)}
.dtable th:first-child{z-index:2}
.dtable tfoot td:first-child{background:var(--sunk)}
.sortbtn{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;white-space:nowrap}
.colpick{position:relative}
.colpick summary{list-style:none}
.colpick summary::-webkit-details-marker{display:none}
.colgrid{position:absolute;right:0;top:calc(100% + 6px);z-index:6;display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:8px 16px;box-shadow:0 8px 24px rgba(0,0,0,.18);width:max-content;max-width:calc(100vw - 32px)}
/* folha */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(720px,100%);height:100%;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.sheet-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);z-index:2}
.sheet-h .wrap,.sheet-b{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-h .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:12px}
.sheet-b{padding-block:16px;display:flex;flex-direction:column;gap:16px}
dl.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px;margin:0}
dl.kv div{min-width:0}
dl.kv dt{font-size:12px;color:var(--muted)}
dl.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.fgroup{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fgroup label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fgroup label.wide{grid-column:1/-1}
.tl{border-left:2px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:14px}
.tl .it{position:relative}
.tl .it::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.hist{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--fg)}
.chipbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rsec h2{font-size:20px}
.rtable td{vertical-align:top}
.rbar{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.rbar.bad i{background:var(--bad)}
.rstack{display:flex;height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.rstack i{display:block;height:100%}
.rstack i.a,.rlegend i.a{background:var(--accent)}
.rstack i.g,.rlegend i.g{background:var(--good)}
.rlegend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.rlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ccm{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;padding-top:4px}
.ccm-col{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:0}
.ccm-v{font-size:11px;text-align:center;min-height:14px;white-space:nowrap;overflow:visible}
.ccm-bar{height:200px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--sunk);border-radius:6px;overflow:hidden}
.ccm-seg{display:block;width:100%;border:0;padding:0;margin:0;background:var(--accent);border-top:1px solid var(--surface);cursor:pointer;min-height:2px}
.ccm-seg.fc{background:repeating-linear-gradient(45deg,var(--warm) 0 6px,color-mix(in srgb,var(--warm) 70%,transparent) 6px 12px)}
.ccm-seg:hover{filter:brightness(1.15)}
.ccm-l{font-size:12px;text-align:center;color:var(--muted,#888)}
.ccm-col.now .ccm-l{font-weight:700;color:inherit}
.ccm-sw{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--accent);vertical-align:-1px;margin-right:4px}
.ccm-sw.fc{background:var(--warm)}
@media (max-width:560px){.ccm{gap:3px}.ccm-v{font-size:0;min-height:0}.ccm-l{font-size:10px}.ccm-bar{height:160px}}
.vchart{display:flex;gap:10px;align-items:flex-end;overflow-x:auto;padding:8px 2px 2px}
.rsec .frow{grid-template-columns:110px 1fr 180px}
.vcol{flex:0 1 110px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px}
.vval{font-size:12px;min-height:16px;white-space:nowrap}
.vbar{position:relative;width:100%;height:160px;background:var(--sunk);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.vbar i{display:block;width:100%;background:var(--accent);border-radius:8px 8px 0 0}
.vcol.bad .vbar i{background:var(--bad)}
.vbar .meta{position:absolute;left:0;right:0;border-top:2px dashed var(--warm)}
.vlab{font-size:12px;font-weight:600}
.vn{font-size:11px}
body.presenting header.top,body.presenting .rfilters,body.presenting .rchips{display:none}
body.presenting body::before{display:none}
#rep.present .rsec{break-inside:avoid}
.xdel{background:none;border:1px solid transparent;border-radius:6px;color:var(--muted);font-size:16px;line-height:1;padding:4px 8px;cursor:pointer;align-self:center}
.xdel:hover{border-color:var(--line);color:var(--bad)}
.xdel.on{font-size:12px;color:var(--bad);border-color:var(--bad)}
.pplink{background:none;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;text-align:left;font:inherit;color:var(--fg);cursor:pointer;width:100%}
.pplink:hover{border-color:var(--accent)}
.check{width:20px;height:20px;flex:0 0 20px;accent-color:var(--accent);margin-top:2px}
.done .t{text-decoration:line-through;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-size:14px}
.phase{display:flex;flex-direction:column;gap:6px}
.prog{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .2s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
.gsearch{padding:12px 14px}.gsearch input{width:100%;font-size:16px}#gq-res .li{align-items:center}.gq-act{display:flex;gap:6px;flex-shrink:0}.gq-act .btn{padding:6px 12px;font-size:13px}#gq-res .list{margin-top:8px;max-height:420px;overflow-y:auto}
tr.gx{cursor:pointer}tr.gx:hover td{background:var(--bg)}.gxc{display:inline-block;width:16px;color:var(--muted,#888);font-size:11px}
tr.gxd>td{padding:4px 12px 12px 28px!important;white-space:normal;background:var(--bg)}
.gxlist{max-height:360px;overflow-y:auto;display:flex;flex-direction:column}
.gxi{display:grid;grid-template-columns:minmax(140px,1.2fr) 2fr 110px 76px;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line,rgba(0,0,0,.08));font-size:14px}

.hlist{display:flex;flex-direction:column;gap:8px}

.chip.good{background:var(--good-soft);color:var(--good)}.chip.bad{background:var(--bad-soft);color:var(--bad)}

main.wide{max-width:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--surface)}

.btool{gap:8px}.bhint{font-size:12px}

.bgrid th.rn{z-index:3}
.bgrid td[data-c="0"],.bgrid th:nth-child(2){position:sticky;left:44px;z-index:1;font-weight:500;box-shadow:1px 0 0 var(--line)}
.bgrid th:nth-child(2){z-index:3}
.bgrid td.rng{background:var(--accent-soft)}
.bgrid td.sel{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}

.bed{position:absolute;z-index:5;margin:0;border:2px solid var(--accent);border-radius:0;padding:0 6px;font:inherit;font-size:13px;background:var(--surface);color:var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.18)}
select.bed{padding:0 4px}
.gsbar{gap:8px;font-size:13px}.gsb{color:var(--muted)}.gsb.ok{color:var(--good)}.gsb.err{color:var(--bad,#b3261e)}.gsb.sync,.gsb.pend{color:var(--accent)}
.btn.danger{background:var(--bad,#b3261e);color:#fff;border-color:var(--bad,#b3261e)}
.ncm{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.ncm-box{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(560px,100%);box-shadow:0 18px 40px rgba(0,0,0,.25)}

<script>
const ETAPAS=["Mapeado","Abordado","Negociação","Business Plan","Proposta","MoU","Fechado","PF Ativa","PJ Ativa","Perdido"];
const GANHOS=["Fechado","PF Ativa","PJ Ativa"];
const CCM_FECH=GANHOS; // Closed = Fechado em diante (MoU ainda é deal aberto)
const ESC_FROM="PJ Ativa"; const precisaEsc=d=>ETAPAS.indexOf(d.etapa)>=ETAPAS.indexOf(ESC_FROM)&&d.etapa!=="Perdido"&&!(d.nomeEscritorio||"").trim();
const exNome=d=>d.nomeEscritorio&&d.nomeDeal&&d.nomeDeal!==d.nome?d.nomeDeal:"";
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const fmes=ym=>ym&&/^\d{4}-\d{2}/.test(ym)?MESES[+ym.slice(5,7)-1]+"/"+ym.slice(2,4):"—";
const ATIVAS=ETAPAS.slice(0,6);
const PERFIS=["Alta Renda","Private","Varejo","Corporate","Trading","Derivativos","Câmbio","Broker","Mesa","Gestora","Outro"];
const MOTIVOS=["Qualidade","Timing","Multa ou amarra","Assimetria Financeira","Engajamento do Time","Concorrência","Exclusividade/modelo","Outro canal XP"];
const TIPOS=["Deal PJ","Block trade"];
const tipoChip=t=>t?`<span class="chip ${t==="Deal PJ"?"tpj":"tbt"}">${esc(t)}</span>`:"";
const INTERESSES=["Alto","Médio","Baixo"], SITUACOES=["Ativo","Sem retorno","Stand by"];
const CANAIS=["LinkedIn InMail","WhatsApp","Ligação","Indicação","Evento","Presencial","E-mail"];
const REGIOES={Norte:["AC","AM","AP","PA","RO","RR","TO"],Nordeste:["AL","BA","CE","MA","PB","PE","PI","RN","SE"],"Centro-Oeste":["DF","GO","MS","MT"],Sudeste:["ES","MG","RJ","SP"],Sul:["PR","RS","SC"]};
const REGIONAIS=["São Paulo Capital","SP Interior e Sul","RJ, MG e ES","CONONE"];
const nrmC=x=>String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const regXP=(uf,cidade)=>{uf=(uf||"").toUpperCase().trim();const c=nrmC(cidade);
  if(!uf&&/^sao paulo/.test(c))uf="SP";
  if(uf==="SP")return /^sao paulo\b/.test(c)&&!/interior/.test(c)?"São Paulo Capital":"SP Interior e Sul";
  if(["PR","SC","RS"].includes(uf))return "SP Interior e Sul";
  if(["RJ","MG","ES"].includes(uf))return "RJ, MG e ES";
  if(uf&&regiao(uf))return "CONONE";
  return ""};
const regiao=uf=>{uf=(uf||"").toUpperCase().trim();return Object.keys(REGIOES).find(r=>REGIOES[r].includes(uf))||""};
const histAdd=(p,etapa,data)=>{const h=Array.isArray(p.historicoEtapas)?p.historicoEtapas.slice():[];if(!h.length||h.at(-1).etapa!==etapa)h.push({etapa,data});return h};
const TEMPS=["Quente","Morno","Frio"];
const TABS=[["painel","Painel"],["pipeline","Pipeline"],["hunting","Hunting"],["prospects","Mapeamento"],["base","Base de dados"],["todos","To-dos"],["templates","Templates"],["report","Report"],["arquivos","Arquivos"],["roadmap","Roadmap"]];
const TABS_MAIN=["painel","pipeline","hunting","prospects","report"],TABS_MORE=["base","todos","templates","arquivos","roadmap"];

// Campos do prospect: [chave, rótulo, tipo, opções/grupo]
const GROUPS=[
 ["Identificação",[["nome","Nome","text"],["cidade","Cidade","text"],["uf","UF","text"],["telefone","Telefone (WhatsApp)","text"],["email","E-mail","text"],["linkedin","LinkedIn (URL)","text"],["origem","Origem","sel",["LinkedIn","Indicação","Evento","Base própria","Outro"]],["indicadoPor","Indicado por","text"]]],
 ["Perfil profissional",[["instituicao","Instituição atual","text"],["escritorio","Escritório","text"],["cargo","Cargo","text"],["perfil","Perfil","sel",PERFIS],["anosCasa","Anos na casa atual","num"],["anosMercado","Anos de mercado","num"],["certificacoes","Certificações","text"]]],
 ["Carteira",[["aucMi","AUC (R$ mi)","num"],["nClientes","Nº de clientes","num"],["receitaAnualMil","Receita anual (R$ mil)","num"],["roaPct","ROA (% a.a.)","num"]]],
 ["Remuneração atual",[["fixoMil","Fixo mensal (R$ mil)","num"],["variavel","Variável / bônus","text"],["repassePct","Repasse (%)","num"]]],
 ["Amarras contratuais",[["multaMil","Multa (R$ mil)","num"],["multaPrazo","Multa: prazo/condição","text"],["nonCompeteMeses","Non-compete (meses)","num"],["nonSolicit","Non-solicit","sel",["Sim","Não","A confirmar"]],["diferidoMil","Bônus diferido a perder (R$ mil)","num"],["dataLiberacao","Data de liberação","date"]]],
 ["Equipe",[["equipeQtd","Pessoas que traria","num"],["equipeNomes","Quem traria","text"]]],
 ["Negócio",[["modelo","Modelo","sel",["Escritório novo","Entrar em escritório existente","Bloco / M&A","A definir"]],["motivacao","Motivação para sair","area"],["objecoes","Objeções","area"],["concorrentes","Concorrentes na disputa","text"],["captacao12mMi","Captação projetada 12m (R$ mi)","num"],["propostaMil","Proposta / luvas (R$ mil)","num"],["paybackMeses","Payback (meses)","num"],["ccMi","Custódia contratada · CC (R$ mi)","num"]]],
 ["Funil",[["deal","Deal / bloco","deal"],["papel","Papel no deal","sel",["Sócio fundador","Sócio não fundador","2º bloco","Assessor"]],["etapa","Etapa","sel",ETAPAS],["dataEtapa","Entrou na etapa em","date"],["dataAbordagem","Data da 1ª abordagem","date"],["canal","Canal da abordagem","sel",CANAIS],["interesse","Interesse (meu)","sel",INTERESSES],["situacao","Situação do lead","sel",SITUACOES],["comCloser","Com o closer","sel",["Sim","Não"]],["temperatura","Temperatura","sel",TEMPS],["proximoPasso","Próximo passo","text"],["dataProximo","Data do próximo passo","date"],["motivoPerda","Motivo da perda","sel",MOTIVOS],["motivoPerdaObs","Detalhe da perda","text"],["dataAssinatura","Data de assinatura","date"]]],
 ["Background pessoal",[["bg.estadoCivil","Estado civil","text"],["bg.conjugeNome","Nome do cônjuge","text"],["bg.conjugeProfissao","Profissão do cônjuge","text"],["bg.filhos","Filhos (nomes e idades)","text"],["bg.aniversario","Aniversário (dd/mm)","text"],["bg.cidadeNatal","Cidade natal","text"],["bg.formacao","Formação","text"],["bg.hobbies","Hobbies","text"],["bg.time","Time","text"],["bg.eventos","Datas e eventos relevantes","area"]]],
];
const FMAP={};GROUPS.forEach(g=>g[1].forEach(f=>FMAP[f[0]]=f));

let db=null, S={p:{},i:[],t:[],tpl:[],rm:[],deals:[],cfg:{}}, loaded=new Set(), tab="painel", openId=null;
const NCOL=7;
let F={q:"",inst:"",perfil:"",etapa:"",temp:"",casaMin:"",casaMax:"",multa:"",nc:"",aucMin:"",deal:"",interesse:"",situacao:"",closer:"",motivo:"",uf:"",esc:""}, PLIM=200;
const dealOf=id=>S.deals.find(d=>d.id===id);
const members=dId=>Object.entries(S.p).map(([id,d])=>({id,...d})).filter(p=>p.deal===dId);
const core=dId=>members(dId).filter(p=>p.papel==="Sócio fundador"||p.papel==="Sócio não fundador"||p.papel==="Assessor");
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gv=(o,k)=>k.split(".").reduce((a,x)=>a==null?a:a[x],o);
function sv(o,k,v){const ks=k.split(".");let c=o;ks.slice(0,-1).forEach(x=>{c[x]=c[x]&&typeof c[x]==="object"?c[x]:{};c=c[x]});c[ks.at(-1)]=v}
const n=v=>(v===""||v==null||isNaN(+v))?null:+v;
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=(iso,k)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+k);return d.toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const fd=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(2,4):"—";
const nf=(v,d=0)=>v==null?"—":(+v).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const mi=v=>v==null?"—":"R$ "+nf(v,v<10?1:0)+" mi";
const mil=v=>v==null?"—":"R$ "+nf(v)+" mil";
const tempChip=t=>t?`<span class="chip ${t.toLowerCase()}">${esc(t)}</span>`:"";
const exChip=p=>p.exemplo?` <span class="chip ex">EXEMPLO</span>`:"";
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._);toast._=setTimeout(()=>t.hidden=true,2600)}
const prospects=()=>Object.entries(S.p).map(([id,d])=>({id,...d}));
const dealAuc=d=>n(d.aucMi)!=null?n(d.aucMi):core(d.id).reduce((x,p)=>x+(n(p.aucMi)||0),0);
const dealMulta=d=>n(d.multaMil)!=null?n(d.multaMil):core(d.id).reduce((x,p)=>x+(n(p.multaMil)||0),0);
// itens que formam o "AUC no pipe": pessoas ativas + deals com AUC informado no próprio deal (sem contar duas vezes os sócios deles)
function aucItems(){const ov=S.deals.filter(d=>n(d.aucMi)!=null),skip=new Set();ov.forEach(d=>core(d.id).forEach(p=>skip.add(p.id)));
  return prospects().filter(p=>ATIVAS.includes(p.etapa)&&!skip.has(p.id)&&n(p.aucMi)>0).map(p=>({kind:"p",...p}))
    .concat(ov.filter(d=>ATIVAS.includes(d.etapa)&&n(d.aucMi)>0).map(d=>({kind:"deal",id:d.id,nome:d.nome,instituicao:d.origemInst,etapa:d.etapa,deal:d.id,aucMi:n(d.aucMi)})))}
function units(){const coreIds=new Set();S.deals.forEach(d=>core(d.id).forEach(p=>coreIds.add(p.id)));
  return S.deals.map(d=>({kind:"deal",id:d.id,nome:d.nome,etapa:d.etapa,auc:dealAuc(d),cc:n(d.ccMi)}))
    .concat(prospects().filter(p=>!coreIds.has(p.id)).map(p=>({kind:"p",id:p.id,nome:p.nome,etapa:p.etapa,auc:n(p.aucMi)||0,cc:n(p.ccMi)})))}

// ---------- abas
function drawTabs(){
  const lab=k=>(TABS.find(t=>t[0]===k)||[,k])[1];
  $("#tabs").innerHTML=TABS_MAIN.map(k=>`<button role="tab" aria-selected="${k===tab}" data-tab="${k}">${lab(k)}</button>`).join("");
  const inMore=TABS_MORE.includes(tab),open=$("#tmore").classList.contains("open");
  $("#tmore").innerHTML=`<button class="tmore-btn${inMore?" on":""}" data-tmore aria-haspopup="menu" aria-expanded="${open}">${inMore?lab(tab):"Mais"} <span aria-hidden="true">▾</span></button>
    <div class="tmore-menu" role="menu">${TABS_MORE.map(k=>`<button role="menuitem" data-tab="${k}" class="${k===tab?"on":""}">${lab(k)}</button>`).join("")}</div>`;
}
document.addEventListener("click",e=>{const m=$("#tmore");if(!m)return;
  if(e.target.closest("[data-tmore]")){m.classList.toggle("open");e.target.closest("[data-tmore]").setAttribute("aria-expanded",m.classList.contains("open"));return}
  if(m.classList.contains("open")&&(!e.target.closest("#tmore")||e.target.closest("[data-tab]")))m.classList.remove("open")},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#tmore")?.classList.remove("open")});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;tab=b.dataset.tab;try{location.hash=tab}catch(_){};drawTabs();render()});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==tab){tab=h;drawTabs();render()}});
{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))tab=h}

// ---------- filtros com múltipla seleção (OU dentro do filtro, E entre filtros)
let MS_OPEN=null;
const msVal=v=>Array.isArray(v)?v:(v?[v]:[]);
const fok=(v,x)=>{const a=msVal(v);return !a.length||a.includes(x)};
const fokAny=(v,xs)=>{const a=msVal(v);return !a.length||(xs||[]).some(x=>a.includes(x))};
const fhas=(v,x)=>msVal(v).includes(x);
const msTxt=(list,v)=>{const a=msVal(v);return a.map(x=>{const f=list.find(i=>Array.isArray(i)&&String(i[0])===String(x));return f?f[1]:x}).join(", ")};
function ms(id,label,list,val,all="Todos",style=""){
  const it=list.map(x=>Array.isArray(x)?[String(x[0]),x[1]]:[String(x),x]);const a=msVal(val).map(String);
  const txt=!a.length?all:a.length===1?((it.find(i=>i[0]===a[0])||[,a[0]])[1]):`${a.length} selecionados`;
  const box=`<div class="ms${MS_OPEN===id?" open":""}" id="${id}" data-ms data-all="${esc(all)}" style="${style}"><button type="button" class="ms-btn${a.length?" on":""}" data-msbtn title="${esc(a.length?msTxt(list,a):all)}"><span>${esc(txt)}</span><span class="ms-car" aria-hidden="true">▾</span></button>
   <div class="ms-pop">${it.length>8?`<input class="ms-q" type="search" placeholder="Buscar…" data-msq>`:""}<div class="ms-list">${it.map(([v,l])=>`<label class="ms-it"><input type="checkbox" value="${esc(v)}" ${a.includes(v)?"checked":""}><span>${esc(l)}</span></label>`).join("")||`<div class="muted" style="padding:6px">Sem opções</div>`}</div>
   <div class="ms-ft"><button type="button" class="btn small" data-msclr>Limpar</button><button type="button" class="btn small primary" data-msok>OK</button></div></div></div>`;
  return label==null?box:`<div class="mslab">${label}${box}</div>`}
function msFix(){document.querySelectorAll(".ms.open .ms-pop").forEach(p=>{p.style.left="0";p.style.right="auto";const r=p.getBoundingClientRect();if(r.right>innerWidth-8){p.style.left="auto";p.style.right="0"}})}
function msEmit(root){const ch=[...root.querySelectorAll(".ms-list input:checked")],v=ch.map(i=>i.value);root.value=v;
  const bt=root.querySelector(".ms-btn");if(bt){bt.classList.toggle("on",v.length>0);bt.firstElementChild.textContent=!v.length?(root.dataset.all||"Todos"):v.length===1?ch[0].nextElementSibling.textContent:`${v.length} selecionados`;bt.title=v.length?ch.map(i=>i.nextElementSibling.textContent).join(", "):(root.dataset.all||"Todos")}
root.dispatchEvent(new Event("change",{bubbles:true}));requestAnimationFrame(msFix)}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-msbtn]");
  if(b){const r=b.closest("[data-ms]"),was=r.classList.contains("open");document.querySelectorAll(".ms.open").forEach(x=>x.classList.remove("open"));
    if(!was){r.classList.add("open");MS_OPEN=r.id;msFix();const q=r.querySelector("[data-msq]");if(q&&!matchMedia("(hover:none)").matches)q.focus()}else MS_OPEN=null;return}
  const c=e.target.closest("[data-msclr]");if(c){const r=c.closest("[data-ms]");r.querySelectorAll(".ms-list input").forEach(i=>i.checked=false);msEmit(r);return}
  const o=e.target.closest("[data-msok]");if(o){o.closest("[data-ms]").classList.remove("open");MS_OPEN=null;return}
  if(MS_OPEN&&!e.target.closest("[data-ms]")){document.querySelectorAll(".ms.open").forEach(x=>x.classList.remove("open"));MS_OPEN=null}},true);
document.addEventListener("change",e=>{const i=e.target;if(i.type==="checkbox"&&i.closest(".ms-list")){e.stopPropagation();msEmit(i.closest("[data-ms]"))}},true);
document.addEventListener("input",e=>{if(!e.target.matches||!e.target.matches("[data-msq]"))return;e.stopPropagation();const q=nrm(e.target.value);e.target.closest(".ms-pop").querySelectorAll(".ms-it").forEach(l=>l.style.display=!q||nrm(l.textContent).includes(q)?"":"none")},true);

document.addEventListener("click",e=>{const b=e.target.closest("[data-fclear]");if(!b)return;MS_OPEN=null;const k=b.dataset.fclear;
  if(k==="F"){Object.keys(F).forEach(x=>F[x]=Array.isArray(F[x])?[]:"");render()}
  else if(k==="DF"){Object.assign(DF,{...DF0});pipeStage=null;render()}
  else if(k==="HF"){Object.assign(HF,{q:"",fila:[],reg:[],exxp:[],lim:60});render()}
  else if(k==="BASE"){BASE.et=[];BASE.q="";BASE.sel=null;render()}
  else if(k==="BEV"){BASE.evt=[];BASE.evq="";BASE.evp="30";render()}});

function render(){
  const m=$("#main");
  if(!db){m.innerHTML=`<div class="empty">O banco de dados do CRM não está disponível nesta visualização. Abra a página com a sua conta do Claude.</div>`;return}
  if(loaded.size<NCOL){m.innerHTML=`<div class="empty">Carregando dados…</div>`;return}
  m.classList.toggle("wide",tab==="base");
  ({base:rBase,painel:rPainel,pipeline:rPipeline,hunting:rHunting,prospects:rProspects,todos:rTodos,templates:rTemplates,report:rReport,arquivos:rArquivos,roadmap:rRoadmap})[tab](m);
  if(openId)drawDetail(); else if(openDealId)drawDeal(); else if(openKpi&&$("#sbg"))drill(openKpi);

    "Planilha em anexo, pronta para encaminhar."].filter((x,i,a)=>x!==""||(a[i-1]!==""&&i>0));
  await mcp.callTool("Gmail","send_message",{to:[BP_TO],subject:`BP ${bpLabel(k)} · ${nome}`,body:linhas.join("\n"),

  :`<button class="card" data-open="${x.p.id}"><span class="n">${esc(x.p.nome)}${exChip(x.p)}</span><span class="m">${esc([x.p.instituicao,x.p.escritorio,x.p.perfil].filter(Boolean).join(" · "))}</span>${x.p.deal&&dealOf(x.p.deal)?`<span class="m">◆ ${esc(dealOf(x.p.deal).nome)}</span>`:""}<span class="row" style="gap:6px">${tempChip(x.p.temperatura)}<span class="m num">${n(x.p.aucMi)!=null?mi(x.p.aucMi):""}</span></span></button>`).join("")}</div></div>`}).join("")}</div><div id="dealsList" style="margin-top:12px"></div><div id="leadsList" style="margin-top:12px"></div></div>`;

function filterDeals(rows){
  const q=DF.q.trim().toLowerCase();

    if(DF.situacao&&DF.situacao!=="todos"&&r.sit!==DF.situacao)return false;
    if(!fok(DF.hunter,r.hunter))return false;
    {const tp=msVal(DF.tipo);if(tp.length&&!tp.some(t=>t==="_"?!r.tipo:r.tipo===t))return false}
    if(!fok(DF.regiao,r.regiao))return false;
    if(!fok(DF.motivo,r.motivo))return false;
    if(q&&!(r.nome+" "+r.cidade+" "+r.insts.join(" ")+" "+r.sub+" "+r.hunter+" "+r.motivoObs+" "+r.orig+" "+members(r.id).map(p=>p.nome).join(" ")).toLowerCase().includes(q))return false;
    if(!fok(DF.etapa,r.etapa))return false;
    if(!fok(DF.temp,r.temp))return false;
    if(!fok(DF.perfil,r.perfil))return false;
    if(!fokAny(DF.inst,r.insts))return false;
    if(!fok(DF.cidade,r.cidade))return false;
    if(DF.aucMin!==""&&!(r.auc>=+DF.aucMin))return false;
    if(DF.ccMin!==""&&!(r.cc>=+DF.ccMin))return false;
    if(DF.roaMin!==""&&!(r.roa>=+DF.roaMin))return false;
    {const am=msVal(DF.amarra);if(am.length&&!am.some(k=>k==="semMulta"?!(r.multa>0):k==="comMulta"?r.multa>0:k==="comNC"?!!r.ncN:k==="livre"?!(r.multa>0||r.ncN):true))return false}

    return true});
}

function filtered(){
  const q=F.q.trim().toLowerCase();
  return prospects().filter(p=>{
    if(q&&!JSON.stringify(p).toLowerCase().includes(q))return false;
    if(!fok(F.inst,p.instituicao))return false;
    if(!fok(F.esc,p.escritorio))return false;
    if(!fok(F.perfil,p.perfil))return false;
    if(!fok(F.etapa,p.etapa))return false;
    if(!fok(F.temp,p.temperatura))return false;
    if(F.casaMin!==""&&!(n(p.anosCasa)>=+F.casaMin))return false;
    if(F.casaMax!==""&&!(n(p.anosCasa)!=null&&n(p.anosCasa)<=+F.casaMax))return false;
    if(!fok(F.multa,n(p.multaMil)>0?"com":"sem"))return false;
    if(!fok(F.nc,n(p.nonCompeteMeses)>0?"com":"sem"))return false;
    if(F.aucMin!==""&&!(n(p.aucMi)>=+F.aucMin))return false;
    if(!fok(F.interesse,p.interesse))return false;
    if(!fok(F.situacao,p.situacao||"Ativo"))return false;
    if(!fok(F.closer,p.comCloser||"Não"))return false;
    if(!fok(F.motivo,p.motivoPerda))return false;
    if(!fok(F.uf,p.uf))return false;
    if(!fok(F.deal,p.deal))return false;
    return true});
}

async function bulkApply(k){
  const B=BULK[k], ids=[...SEL[k]], t=today();
  if(!B.v){toast("Escolha o novo valor");return}
  if(B.f==="etapa"&&B.v==="Perdido"&&!B.m){toast("Escolha o motivo da perda");return}
  const val=B.v==="__clear"?"":B.v;
  const btn=document.querySelector(`[data-bkapply="${k}"]`); if(btn){btn.disabled=true;btn.textContent="Aplicando…"}
  let ok=0,fail=0;
  const one=async id=>{
    try{
      if(k==="d"){
        const d=dealOf(id); if(!d)return;
        const upd={[B.f]:val};
        if(B.f==="etapa"){upd.dataEtapa=t;if(val==="Perdido")upd.motivoPerda=B.m}

        const upd={[B.f]:val,atualizadoEm:t};
        if(B.f==="etapa"){upd.dataEtapa=t;upd.historicoEtapas=histAdd(p,val,t);if(val==="Perdido")upd.motivoPerda=B.m}
        await db.doc("prospects/"+id).update(upd);
      }

  render();
}

function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
// guarda os bytes de um arquivo no CRM do Claude (Excel em rawfiles + visão JSON; PDF/imagem em assets)
async function storeFile(nome,ab,mime){
  const ext=(nome.split(".").pop()||"").toLowerCase();let rawId=null,kind="file",tipo=ext.toUpperCase(),res;
  if(ext==="xlsx"||ext==="xls"||ext==="xlsm"){
    await loadXLSX();
    if(ab.byteLength<6e6){rawId="raw_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);await rawPut(rawId,ab,{nome,tamanho:ab.byteLength})}
    const wb=XLSX.read(ab);const sheets={};
    wb.SheetNames.forEach(nm=>sheets[nm]=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:false,blankrows:false,defval:""}));
    res=await assetsNs.upload(new Blob([JSON.stringify({arquivo:nome,sheets})],{type:"application/json"}),{type:"application/json"});kind="sheet";tipo="Excel";
  }else if(ext==="pptx"||ext==="docx"||ext==="ppt"||ext==="doc"){
    if(ab.byteLength>6e6)throw {code:"too_large"};
    rawId="raw_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);await rawPut(rawId,ab,{nome,tamanho:ab.byteLength,mime:mime||""});
    return {id:rawId,kind:"raw",tipo:ext.toUpperCase(),rawId};
  }else{
    const tp=ext==="pdf"?"application/pdf":ext==="csv"?"text/csv":(mime||"");
    res=await assetsNs.upload(new Blob([ab],{type:tp}),{type:tp});if(tp.startsWith("image/"))kind="image";
  }
  return {id:res.id,kind,tipo,rawId}}
function anexoAcao(x){
  const gid=x.gsId||(String(x.id).startsWith("gs:")?String(x.id).slice(3):"");
  if(window.__SITE){if(gid)return `<button class="btn small" data-gsdl="${esc(gid)}" data-nome="${esc(x.nome)}">Baixar</button>`;return `<span class="muted" style="font-size:12px">Disponível no CRM do Claude</span>`}
  if(String(x.id).startsWith("gs:"))return `<span class="chip warn">Importando…</span>`;
  if(x.kind==="raw"&&x.rawId)return `<button class="btn small" data-rawdl="${esc(x.rawId)}" data-nome="${esc(x.nome)}">Baixar</button>`;
  return ""}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-rawdl]");if(!b)return;try{const r=await rawGet(b.dataset.rawdl);if(!r)throw 0;const dl=await claude.use("downloads");if(!dl)throw 0;await dl.save({filename:b.dataset.nome||"arquivo",data:new Blob([r.ab])})}catch(_){toast("Não consegui baixar o arquivo")}});
async function uploadAnexo(dId,input){
  const f=input.files&&input.files[0]; if(!f)return;
  const ext=(f.name.split(".").pop()||"").toLowerCase();
  const tipoDoc=($("#upTipo")||{}).value||"outro";
  toast("Enviando "+f.name+"…");
  try{
    let ent;
    if(window.__SITE){
      if(!window.__siteFiles)throw {code:"unavailable"};
      const gid=await window.__siteFiles.put(f,{dealId:dId,tipoDoc});
      ent={lerDoc:true,id:"gs:"+gid,gsId:gid,nome:f.name,tipo:ext==="xlsx"||ext==="xlsm"||ext==="xls"?"Excel":ext.toUpperCase(),kind:"file",data:today(),tipoDoc,origem:"Site",autor:window.__siteUser||""};
    }else{
      const s=await storeFile(f.name,await f.arrayBuffer(),f.type);
      ent={id:s.id,nome:f.name,tipo:s.tipo,kind:s.kind,data:today(),tipoDoc,lerDoc:true};if(s.rawId)ent.rawId=s.rawId;
    }
    const d=dealOf(dId);const cur=(rawDeal(dId)||{}).anexos||[];
    const novos=[...cur,ent];
    await db.doc("deals/"+dId).update({anexos:novos});
    toast(window.__SITE?"Anexado. O CRM do Claude importa o arquivo na próxima sincronização.":"Anexado ao deal");
    const nd={...d,anexos:novos}; if(!window.__SITE&&bastaoPronto(nd)&&!(d.bastaoEnviado||[]).length)setTimeout(()=>enviarBastao(dId,true),800);
  }catch(err){const c=err&&err.code;toast(err&&err.message&&!c?err.message:c==="unsupported_type"?"Tipo de arquivo não suportado. Use PDF, Excel, CSV ou imagem.":c==="too_large"?"Arquivo acima de 20 MB.":c==="quota_or_state"?"Espaço de anexos cheio.":"Não foi possível anexar. Tente de novo.")}
  input.value="";
}

function openForm(id,preset){

  const inp=f=>{const[k,l,ty,o]=f, val=gv(p,k)??"", fid="pf-"+k.replace(".","_");
    if(ty==="deal")return `<label for="${fid}">${l}<select id="${fid}" data-k="${k}"><option value="">Nenhum</option>${S.deals.map(d=>`<option value="${d.id}" ${d.id===val?"selected":""}>${esc(d.nome)}</option>`).join("")}</select></label>`;
    if(ty==="sel")return `<label for="${fid}">${l}<select id="${fid}" data-k="${k}"><option value=""></option>${o.map(x=>`<option ${x===val?"selected":""}>${x}</option>`).join("")}</select></label>`;
    if(ty==="area")return `<label class="wide" for="${fid}">${l}<textarea id="${fid}" data-k="${k}" rows="3">${esc(val)}</textarea></label>`;
    return `<label for="${fid}">${l}<input id="${fid}" data-k="${k}" type="${ty==="num"?"number":ty==="date"?"date":"text"}" ${ty==="num"?'inputmode="decimal" step="any"':""} value="${esc(val)}"></label>`};
  openId=null;

  $("#cancelF").onclick=()=>{closeSheet();if(id){openId=id;drawDetail()}};
  $("#pform").onsubmit=e=>{e.preventDefault();
    const d=JSON.parse(JSON.stringify(p));
    document.querySelectorAll("#pform [data-k]").forEach(el=>{const k=el.dataset.k,f=FMAP[k];let v=el.value.trim();if(f[2]==="num")v=v===""?null:+v;sv(d,k,v)});

async function docTexto(x){

    for(const [nm,rows] of Object.entries(j.sheets||{})){if(/^aux|^sheet1$|^chart/i.test(nm))continue;let s=`\n### Aba: ${nm}\n`;
      rows.forEach((r,i)=>{const cells=r.map(c=>String(c??"").trim());if(cells.some(Boolean))s+=`${i+1}: ${cells.join(" | ").replace(/( \| )+$/,"")}\n`});
      out+=s.slice(0,18000)}
    return out.slice(0,45000)}
  if(/\.(pptx|docx)$/i.test(x.nome||"")){const ab=await anexoBytes(x);if(!ab)return null;await loadJSZip();const z=await JSZip.loadAsync(ab);let out="";
    const xt=s=>(s.match(/<a:t>([^<]*)<\/a:t>|<w:t[^>]*>([^<]*)<\/w:t>|<\/a:p>|<\/w:p>/g)||[]).map(m=>/^<\/(a|w):p>$/.test(m)?"\n":m.replace(/<[^>]+>/g,"")).join(" ").replace(/ *\n */g,"\n").replace(/\n{2,}/g,"\n").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"');
    if(/\.pptx$/i.test(x.nome)){const sl=Object.keys(z.files).filter(f=>/^ppt\/slides\/slide\d+\.xml$/.test(f)).sort((a,b)=>+a.match(/(\d+)\.xml/)[1]-+b.match(/(\d+)\.xml/)[1]);
      for(const f of sl){out+=`\n--- slide ${f.match(/(\d+)\.xml/)[1]} ---\n`+xt(await z.file(f).async("string"))}}
    else{const f=z.file("word/document.xml");if(f)out=xt(await f.async("string"))}
    return out.slice(0,45000)}
  const ehPdf=/pdf/i.test(x.tipo||"")||/\.pdf$/i.test(x.nome||"");
  if(ehPdf){const ab=await anexoBytes(x);if(!ab)return null;const lib=await loadPDFJS();const pdf=await lib.getDocument({data:new Uint8Array(ab)}).promise;let out="";
    for(let i=1;i<=Math.min(pdf.numPages,25);i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();out+=`\n--- página ${i} ---\n`+tc.items.map(t=>t.str).join(" ")}
    return out.slice(0,45000)}
  return null}

function ncPrompt(col,id,o,n){
  const F=NC_FIELDS[col];const atual={};Object.keys(F).forEach(k=>{if(o[k]!==undefined&&o[k]!==""&&o[k]!==null)atual[k]=o[k]});
  const opts=Object.keys(F).map(k=>`- ${k}: ${F[k]}${NC_OPTS[k]?" — valores possíveis: "+NC_OPTS[k].join(" | "):NC_NUM.has(k)?" — número":k.startsWith("data")?" — data aaaa-mm-dd":k==="previsaoFechamento"?" — aaaa-mm":""}`).join("\n");
  let ctx="";if(col==="prospects"&&o.deal){const d=dealOf(o.deal);if(d)ctx=`Esta pessoa faz parte do deal "${d.nome}" (etapa ${d.etapa}).`}
  if(col==="deals"){ctx=`Pessoas do deal: ${members(id).map(p=>p.nome+(p.papel?" ("+p.papel+")":"")).join(", ")||"nenhuma"}.`}
  return `Você atualiza um CRM de hunting da XP Investimentos (prospecção de assessores e escritórios para abrir escritórios parceiros). Hoje é ${today()}.
Registro: ${col==="prospects"?"pessoa (lead)":"deal"} "${o.nome||id}". ${ctx}
Campos atuais (JSON): ${JSON.stringify(atual)}

Campos que você pode alterar:
${opts}

Nota do call (${n.data}, ${n.canal}, escrita por ${n.autor||"o time"}):
"""${n.texto}"""

Responda só com um JSON neste formato:
{"campos":{"campo":"novo valor"},"interacao":{"resumo":"resumo objetivo do call em 1 a 3 frases","sentimento":"Positivo|Neutro|Negativo"},"todos":[{"tarefa":"...","prazo":"aaaa-mm-dd"}],"resumo":"o que mudou, em uma frase"}
Regras:
- Altere só o que a nota sustenta claramente. Não invente números nem datas. Se nada mudar num campo, não o inclua.
- Use exatamente um dos valores possíveis quando houver lista. Números sem unidade, nas unidades indicadas (R$ mi, R$ mil, meses, %; ROA 0,9% = 0.9).
- Datas relativas ("sexta", "semana que vem") viram datas aaaa-mm-dd a partir de hoje.
- Em campos de texto que acumulam (objecoes, obs, motivacao, pontosAtencao, resumo), devolva o texto completo: o atual mais a informação nova, sem repetir o que já existe.
- proximoPasso: frase curta e acionável; preencha dataProximo quando a nota indicar prazo.
- todos: só tarefas concretas citadas na nota (pode ser lista vazia).
- Escreva em português do Brasil.`}
async function ncProcess(col,id,nid,nObj,auto){
  if(!SAMPLE){toast("O processamento pelo Claude funciona no CRM dentro do Claude");return false}
  const o=ncDoc(col,id);if(!o)return false;
  const n=nObj||(o.notasCall||[]).find(x=>x.id===nid);if(!n||n.status==="processada")return false;
  if(!auto)ncModal(`<div class="muted">O Claude está lendo a nota…</div>`);
  let r;try{r=await SAMPLE.json(ncPrompt(col,id,o,n),{modelTier:"default"})}
  catch(e){NC_FAIL.add(nid);if(!auto)ncModal(`<div>Não consegui processar agora (${esc(e.code||"erro")}).</div><div class="row" style="justify-content:flex-end"><button class="btn" data-ncclose>Fechar</button></div>`);return false}
  const F=NC_FIELDS[col],campos=(r&&r.campos)||{};
  const ch=Object.keys(campos).filter(k=>F[k]).map(k=>{let v=campos[k];if(NC_NUM.has(k)&&v!==null&&v!==""){const x=+String(v).replace(",",".");v=isNaN(x)?v:x}if(NC_OPTS[k]&&v&&!NC_OPTS[k].includes(v))return null;return {k,de:o[k],para:v}}).filter(x=>x&&evJ(x.de)!==evJ(x.para));
  const todos=((r&&r.todos)||[]).filter(t=>t&&t.tarefa);const it=(r&&r.interacao)||{};
  NC_PEND={col,id,nid,ch,todos,it,resumo:(r&&r.resumo)||""};
  if(auto){const P=NC_PEND;NC_PEND=null;await ncApplyP(P,P.ch,P.todos);return true}
  const fv=v=>v===undefined||v===null||v===""?"vazio":/^\d{4}-\d{2}-\d{2}$/.test(String(v))?fd(String(v)):String(v);
  ncModal(`<h3 style="margin:0">Atualizações propostas · ${esc(ncNome(col,id))}</h3>
   <div class="muted" style="font-size:13px">${esc(NC_PEND.resumo)}</div>
   ${ch.length?`<div class="list">${ch.map((c,i)=>`<label class="item" style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" data-ncch="${i}" checked style="width:auto;margin-top:3px"><span><b>${esc(F[c.k])}</b><br><span class="muted">${esc(fv(c.de))}</span> → ${esc(fv(c.para))}</span></label>`).join("")}</div>`:`<div class="muted">Nenhum campo do card precisa mudar.</div>`}
   ${todos.length?`<div><b>To-dos</b>${todos.map((t,i)=>`<label class="item" style="display:flex;gap:10px"><input type="checkbox" data-nctd="${i}" checked style="width:auto">${esc(t.tarefa)}${t.prazo?` · <span class="muted">${fd(t.prazo)}</span>`:""}</label>`).join("")}</div>`:""}
   ${it.resumo?`<div><b>Interação registrada</b><div class="muted" style="font-size:13px">${esc(it.resumo)}</div></div>`:""}
   <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" data-ncclose>Cancelar</button><button class="btn primary" data-ncapply>Aplicar</button></div>`)}
let NC_PEND=null;
function ncModal(html){let m=$("#ncm");if(!m){m=document.createElement("div");m.id="ncm";m.className="ncm";document.body.appendChild(m)}m.innerHTML=`<div class="ncm-box stack">${html}</div>`}
function ncClose(){const m=$("#ncm");if(m)m.remove();NC_PEND=null}
async function ncApply(){
  const P=NC_PEND;if(!P)return;
  const sel=P.ch.filter((c,i)=>{const e=document.querySelector(`[data-ncch="${i}"]`);return !e||e.checked});
  const tds=P.todos.filter((t,i)=>{const e=document.querySelector(`[data-nctd="${i}"]`);return !e||e.checked});
  await ncApplyP(P,sel,tds);ncClose()}
async function ncApplyP(P,sel,tds){
  const {col,id}=P;const o=ncDoc(col,id);if(!o)return;
  const cur=(o.notasCall||[]).find(n=>n.id===P.nid);if(!cur||cur.status==="processada")return;
  const upd={};sel.forEach(c=>upd[c.k]=c.para);
  if(upd.etapa&&upd.etapa!==o.etapa){upd.dataEtapa=today();if(col==="prospects")upd.historicoEtapas=histAdd(o,upd.etapa,today())}
  if(col==="prospects")upd.atualizadoEm=today();
  const nota=(o.notasCall||[]).map(n=>n.id===P.nid?{...n,status:"processada",processadaEm:new Date().toISOString(),resultado:(sel.map(c=>NC_FIELDS[col][c.k]).join(", ")||"sem alterações nos campos")+(tds.length?` · ${tds.length} to-do(s)`:"")}:n);
  upd.notasCall=nota;
  EV_ORIGEM="Nota de call · Claude";
  try{
    await db.doc(col+"/"+id).update(upd);
    if(col==="deals"&&upd.etapa&&upd.etapa!==o.etapa)for(const p of core(id))await db.doc("prospects/"+p.id).update({etapa:upd.etapa,dataEtapa:today(),atualizadoEm:today(),historicoEtapas:histAdd(p,upd.etapa,today())});
    const n=(o.notasCall||[]).find(x=>x.id===P.nid)||{};
    if(P.it&&P.it.resumo)await db.collection("interacoes").add({dealId:col==="deals"?id:(o.deal||""),prospectId:col==="prospects"?id:(o.originadorId||""),data:n.data||today(),canal:n.canal||"Ligação",resumo:P.it.resumo,sentimento:P.it.sentimento||"Neutro",fonte:"Nota de call · Claude"});
    for(const t of tds)await db.collection("todos").add({tarefa:t.tarefa,prazo:t.prazo||"",status:"Aberto",prioridade:"Média",dealId:col==="deals"?id:(o.deal||""),prospectId:col==="prospects"?id:"",origem:"Nota de call",criadoEm:today()});
  }
  catch(e){NC_FAIL.add(P.nid)}
  finally{EV_ORIGEM=null}}
const NC_RUNNING=new Set(),NC_FAIL=new Set();let NC_T=null,NC_BUSY=false;
function ncAutoSoon(ms){if(!SAMPLE)return;clearTimeout(NC_T);NC_T=setTimeout(ncAuto,ms||4000)}
async function ncAuto(){
  if(!SAMPLE||NC_BUSY||loaded.size<NCOL)return;
  const fila=ncPend().filter(x=>!NC_FAIL.has(x.n.id)&&!NC_RUNNING.has(x.n.id));if(!fila.length)return;
  NC_BUSY=true;let ok=0;
  try{for(const x of fila){NC_RUNNING.add(x.n.id);if(tab==="painel"||openDealId)render();
      try{if(await ncProcess(x.col,x.id,x.n.id,null,true))ok++}finally{NC_RUNNING.delete(x.n.id)}}}
  finally{NC_BUSY=false;render();if(ok)toast(`${ok} nota${ok>1?"s":""} de call processada${ok>1?"s":""} pelo Claude`)}
  if(ncPend().some(x=>!NC_FAIL.has(x.n.id)))ncAutoSoon(3000)}
function ncPainel(){const p=ncPend();if(!p.length)return "";
  return `<div class="panel stack"><div class="row spread"><h3>Notas de call pendentes</h3><span class="chip warn">${p.length}</span></div>
   <div class="list">${p.slice(0,12).map(x=>`<div class="item"><div class="row spread" style="gap:8px"><button class="link" ${x.col==="deals"?`data-deal="${esc(x.id)}"`:`data-open="${esc(x.id)}"`}>${esc(ncNome(x.col,x.id))}</button>
     <span class="row" style="gap:6px"><span class="muted num" style="font-size:12px">${fd(x.n.data||"")}${x.n.autor?" · "+esc(x.n.autor):""}</span>${SAMPLE?(NC_FAIL.has(x.n.id)?`<button class="btn small" data-ncproc="${x.col}|${esc(x.id)}|${esc(x.n.id)}">Tentar de novo</button>`:`<span class="chip warn">${NC_RUNNING.has(x.n.id)?"Processando…":"Na fila"}</span>`):""}</span></div>
     <div class="muted" style="font-size:13px">${esc(String(x.n.texto).slice(0,180))}${String(x.n.texto).length>180?"…":""}</div></div>`).join("")}</div></div>`}
document.addEventListener("click",async e=>{const g=e.target.closest("[data-gsdl]");if(!g||!window.__siteFiles)return;
  toast("Baixando…");try{const f=await window.__siteFiles.get(g.dataset.gsdl);const a=document.createElement("a");a.href=URL.createObjectURL(f.blob);a.download=f.nome||g.dataset.nome||"arquivo";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}catch(err){toast("Não consegui baixar o arquivo")}});
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-ncadd]");if(a){const [c,i]=a.dataset.ncadd.split("|");ncAdd(c,i,!!a.dataset.ncgo);return}
  const p=e.target.closest("[data-ncproc]");if(p){const [c,i,n]=p.dataset.ncproc.split("|");NC_FAIL.delete(n);ncProcess(c,i,n);return}
  if(e.target.closest("[data-ncapply]")){ncApply();return}
  if(e.target.closest("[data-ncclose]")){ncClose();return}
});
